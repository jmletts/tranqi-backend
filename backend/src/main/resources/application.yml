spring:
  application:
    name: tranki-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tranki_dev}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASS:tranqi@2026}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:8081}

mqtt:
  broker:
    host: ${MQTT_HOST:192.168.1.100}
    port: ${MQTT_PORT:1883}
  client:
    id: ${MQTT_CLIENT_ID:tranki-backend-node}
  topics:
    blacklist-urgent: /flota/listanegra/urgente
