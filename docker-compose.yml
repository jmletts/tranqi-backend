services:
  # ── Base de datos PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: tranki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tranki_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tranqi@2026
    ports:
      - "5432:5432"
    volumes:
      - tranki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tranki_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Broker MQTT (Mosquitto) ──────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: tranki-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT sin TLS (red local / Docker)
      - "9001:9001"   # WebSocket MQTT (para dashboards web opcionales)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - tranki_mosquitto_data:/mosquitto/data
      - tranki_mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t health -m ping -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Spring Boot ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tranki-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tranki_dev
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: tranqi@2026
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
      # MQTT — apunta al servicio Mosquitto interno de Docker
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_USER: ""
      MQTT_PASS: ""

volumes:
  tranki_pgdata:
  tranki_mosquitto_data:
  tranki_mosquitto_log:
