services:
  db:
    image: postgres:16-alpine
    container_name: tranki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tranki_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tranqi@2026
    ports:
      - "5432:5432"
    volumes:
      - tranki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tranki_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tranki-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tranki_dev
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: tranqi@2026
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tranki-frontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - EXPO_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend

volumes:
  tranki_pgdata:
